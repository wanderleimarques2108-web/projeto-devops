# ==========================================================
# INVENTÁRIO DE EXEMPLO
# ----------------------------------------------------------
# 1) Copie este arquivo:   cp inventory.example.ini inventory.ini
# 2) Edite o inventory.ini com o IP, o usuário e a chave SSH
#    do servidor de destino.
# O inventory.ini está no .gitignore: IP e caminho de chave
# NÃO vão para o repositório (mesma regra da N1).
# ==========================================================

[web]
# Servidor Ubuntu (ex.: VPS Hostinger da N1, usuário root ou outro com sudo)
servidor-n2 ansible_host=<IP_DO_SERVIDOR> ansible_user=<USUARIO> ansible_ssh_private_key_file=~/.ssh/<SUA_CHAVE>

# Servidor Oracle Linux na OCI (usuário padrão: opc)
# servidor-oci ansible_host=<IP_DA_VM_OCI> ansible_user=opc ansible_ssh_private_key_file=~/.ssh/<SUA_CHAVE>

# Login por senha em vez de chave (exige o pacote sshpass no control node):
# servidor-n2 ansible_host=<IP> ansible_user=<USUARIO> ansible_ssh_pass=<SENHA>
#   -> se usar senha, rode o playbook com --ask-pass ou use ansible-vault.

[web:vars]
# Porta SSH (troque se o servidor usar outra)
ansible_port=22
