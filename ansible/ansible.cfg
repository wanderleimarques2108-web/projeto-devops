[defaults]
# Inventário padrão (copiado de inventory.example.ini; não vai para o Git)
inventory = ./inventory.ini
roles_path = ./roles
# Evita a pergunta de "host key" na primeira conexão com um servidor novo
host_key_checking = False
# Deixa o Ansible escolher o Python do servidor sem mostrar aviso
interpreter_python = auto_silent
# Saída mais legível no terminal
stdout_callback = default
result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
