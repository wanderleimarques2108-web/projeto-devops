name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  TEST_TAG: site:test

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ github.run_number }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export to Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}

      - name: Test
        run: |
          docker run -d --name teste -p 8080:80 ${{ env.TEST_TAG }}
          sleep 3
          curl -fsS -o /dev/null http://localhost:8080/ && echo "/ OK"
          for f in $(cd site && git ls-files '*.html' '*.css'); do
            curl -fsS -o /dev/null "http://localhost:8080/$f" && echo "$f OK"
          done
          docker rm -f teste

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
