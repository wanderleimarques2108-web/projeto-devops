name: Ansible

# Valida a sintaxe do playbook sempre que algo em ansible/ mudar.
# Não executa nada em servidor: só confere se o código está correto.
on:
  push:
    branches: [main]
    paths: ["ansible/**", ".github/workflows/ansible.yml"]
  pull_request:
    paths: ["ansible/**", ".github/workflows/ansible.yml"]

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar o Ansible
        run: pipx install --include-deps ansible-core

      - name: Instalar as coleções
        run: ansible-galaxy collection install -r requirements.yml

      - name: Verificar a sintaxe do playbook
        run: ansible-playbook -i inventory.example.ini playbook.yml --syntax-check
