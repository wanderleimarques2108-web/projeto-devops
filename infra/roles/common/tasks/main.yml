---
- name: Atualizar cache do apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Instalar pacotes básicos
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - ufw
      - unattended-upgrades
    state: present

- name: Ajustar fuso horário
  community.general.timezone:
    name: America/Sao_Paulo
