---
- name: Remover pacotes Docker não oficiais
  ansible.builtin.apt:
    name: [docker.io, docker-compose, docker-compose-v2, podman-docker, containerd, runc]
    state: absent

- name: Adicionar repositório oficial do Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Instalar Docker Engine e Compose
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Garantir Docker ativo no boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Adicionar {{ deploy_user }} ao grupo docker
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true

# Reconecta para o grupo docker valer já nesta execução
- name: Resetar conexão SSH
  ansible.builtin.meta: reset_connection
