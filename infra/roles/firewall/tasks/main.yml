---
# A regra do SSH entra antes de ativar o UFW para não perder o acesso.
- name: Liberar portas permitidas
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ firewall_allowed_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"

- name: Bloquear entrada por padrão
  community.general.ufw:
    direction: incoming
    default: deny

- name: Permitir saída por padrão
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Ativar UFW
  community.general.ufw:
    state: enabled
